<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비즈톡(BizTalk) — 비즈니스 업무 말투 변환기</title>
    <meta name="description" content="일상적인 표현을 상사, 동료, 고객의 상황에 맞춤화된 전문적이고 격식 있는 비즈니스 어조로 자동 변환해 주는 생산성 도구입니다.">
    <!-- Google Fonts: Outfit 및 Pretendard CDN 링크 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <span class="eyebrow" id="appEyebrow">BIZTALK CONVERTER</span>
            <h1 class="main-title" id="appTitle">말 한마디로 결정되는<br>비즈니스의 격과 품격</h1>
            <p class="sub-title">일상의 거친 생각을 정제되고 세련된 비즈니스 텍스트로 즉시 고쳐 씁니다.</p>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="app-main">
            <!-- 좌측: 입력 및 제어 패널 -->
            <section class="panel panel-input" id="inputPanel">
                <div class="panel-header">
                    <label for="inputText" class="panel-label">ORIGINAL THOUGHT</label>
                    <span class="char-counter" id="charCounter">0자</span>
                </div>
                <div class="textarea-wrapper">
                    <textarea 
                        id="inputText" 
                        placeholder="상사나 고객에게 보낼 메시지 원문을 편하게 적어보세요.&#10;(예: 나 오늘 아파서 출근 어려울 듯)"
                        maxlength="1000"
                    ></textarea>
                </div>

                <!-- 수신 대상 선택 카드 -->
                <div class="audience-section">
                    <span class="section-label">SELECT AUDIENCE</span>
                    <div class="audience-grid" role="radiogroup" aria-label="수신 대상 선택">
                        <button type="button" class="audience-btn active" data-target="boss" id="btnBoss" role="radio" aria-checked="true">
                            <span class="btn-icon">💼</span>
                            <span class="btn-title">상사 / 임원</span>
                            <span class="btn-desc">격식 있고 공손한 직언</span>
                        </button>
                        <button type="button" class="audience-btn" data-target="colleague" id="btnColleague" role="radio" aria-checked="false">
                            <span class="btn-icon">🤝</span>
                            <span class="btn-title">타팀 동료</span>
                            <span class="btn-desc">정중하고 협조적인 공조</span>
                        </button>
                        <button type="button" class="audience-btn" data-target="client" id="btnClient" role="radio" aria-checked="false">
                            <span class="btn-icon">💎</span>
                            <span class="btn-title">고객 / 파트너</span>
                            <span class="btn-desc">신뢰와 감사를 담은 서비스</span>
                        </button>
                        <button type="button" class="audience-btn" data-target="team" id="btnTeam" role="radio" aria-checked="false">
                            <span class="btn-icon">💬</span>
                            <span class="btn-title">팀 내 동료</span>
                            <span class="btn-desc">간결하고 실무적인 공조</span>
                        </button>
                    </div>
                </div>

                <!-- 변환 버튼 -->
                <button type="button" class="action-btn" id="convertBtn">
                    <span>비즈니스 톤으로 고쳐 쓰기</span>
                    <span class="btn-arrow">→</span>
                </button>
            </section>

            <!-- 우측: 결과 출력 패널 -->
            <section class="panel panel-output" id="outputPanel">
                <div class="panel-header">
                    <span class="panel-label">REFINED BUSINESS TEXT</span>
                </div>
                <div class="textarea-wrapper">
                    <!-- 결과가 표시될 에디터 영역 -->
                    <div class="result-placeholder" id="resultPlaceholder">
                        <div class="placeholder-icon">✍️</div>
                        <p>수신 대상을 선택하고 변환하기를 클릭하면<br>이곳에 정제된 비즈니스 텍스트가 나타납니다.</p>
                    </div>
                    <textarea 
                        id="outputText" 
                        readonly 
                        placeholder="정제된 비즈니스 메시지가 출력되는 영역입니다."
                        class="hidden"
                    ></textarea>
                </div>

                <!-- 결과 동작 제어 -->
                <div class="output-actions">
                    <button type="button" class="action-btn secondary disabled" id="copyBtn" disabled>
                        <span class="copy-icon">📋</span>
                        <span id="copyBtnText">클립보드 복사하기</span>
                    </button>
                </div>
            </section>
        </main>

        <!-- 푸터 영역 -->
        <footer class="app-footer">
            <p>&copy; 2026 BizTalk. Designed for high productivity and professional dignity.</p>
        </footer>
    </div>

    <!-- 스크립트 연결 -->
    <script src="js/app.js"></script>
</body>
</html>
